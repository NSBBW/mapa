<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiosk Nobel Tower</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nobel Tower">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Układ kiosku: po lewej lista celów i kroki trasy, po prawej plan parteru.
   Paleta z logo Nobel Tower (grafit i trzy zielenie rombów), romb jako motyw znaczników pięter.
   Jedna jasna wersja, bo ekran pracuje w jasnym holu. */
:root{
  --f-d:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-b:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --bg:#EEF2EF; --panel:#FFFFFF; --panel-2:#F4F7F5; --ink:#404040; --muted:#66726B; --line:#D6DED9;
  --g:#087838; --g-lt:#50B058; --g-dk:#084820; --g-tint:#E3F1E6;
  --plan-bg:#F7F9F8; --plan-street:#E4EAE6; --wall:#404040;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 18px/1.4 var(--f-b);
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(340px,430px) minmax(0,1fr);gap:16px;height:100%;min-height:0}

.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:14px;padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.brand svg{width:42px;height:auto;flex:none}
.brand b{display:block;font:700 28px/.95 var(--f-d);letter-spacing:.01em;color:var(--ink)}
.brand small{display:block;margin-top:5px;font:500 14px var(--f-b);color:var(--muted);letter-spacing:.02em}

#home,#route{display:flex;flex-direction:column;min-height:0;flex:1}
.lead{padding:18px 22px 6px}
h1{margin:0;font:700 40px/1 var(--f-d);letter-spacing:-.005em;text-wrap:balance}
.lead p{margin:6px 0 0;color:var(--muted);font-size:17px}

.list{list-style:none;margin:0;padding:6px 12px 14px;overflow:auto;flex:1;min-height:0}
.gh{position:sticky;top:0;z-index:1;margin:0;padding:12px 10px 6px;background:var(--panel);font:600 14px var(--f-d);letter-spacing:.16em;text-transform:uppercase;color:var(--g)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 46px;align-items:center;gap:14px;width:100%;min-height:72px;padding:8px 10px;border:0;border-radius:12px;background:transparent;text-align:left}
.row:hover,.row:active{background:var(--g-tint)}
.ic{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--g-tint)}
.ic svg{width:24px;height:24px;stroke:var(--g);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rn{display:block;font:600 24px/1.1 var(--f-d);letter-spacing:.005em}
.rs{display:block;margin-top:2px;font-size:15px;line-height:1.3;color:var(--muted)}
.rh{display:grid;place-items:center;width:46px;height:54px;background:var(--g);color:#fff;font:700 22px var(--f-d);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);font-variant-numeric:tabular-nums}
.rh.w{background:var(--g-dk)}

.rv-top{padding:16px 22px 12px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;min-height:56px;padding:0 20px;border:2px solid var(--line);border-radius:12px;background:var(--panel-2);font:600 20px var(--f-d);letter-spacing:.02em}
.back:active{background:var(--g-tint)}
.dest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.dest h2{margin:0;font:700 34px/1.04 var(--f-d);text-wrap:balance}
.dest p{margin:5px 0 0;color:var(--muted);font-size:16px}
.fl{display:grid;justify-items:center;gap:2px}
.fl .rh{width:60px;height:70px;font-size:30px}
.fl>span:last-child{font:600 12px var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.via{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--g-tint);font:600 20px var(--f-d);letter-spacing:.01em}
.via i{display:grid;place-items:center;min-width:34px;white-space:nowrap;height:34px;padding:0 8px;border-radius:999px;background:var(--g);color:#fff;font:700 18px/1 var(--f-d);font-style:normal}
.steps{list-style:none;margin:0;padding:12px 14px 18px;overflow:auto;flex:1;min-height:0;counter-reset:s}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:12px 8px;align-items:start}
.step+.step{border-top:1px solid var(--line)}
.sn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;font:700 20px var(--f-d)}
.step.last .sn{background:var(--g-dk)}
.st{font-size:20px;line-height:1.35;padding-top:5px}

.stage{position:relative;background:var(--plan-bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:0;min-width:0}
#map{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}

/* plan */
.hall{fill:#fff;stroke:var(--wall);stroke-width:5}
.blob{fill:#EEF1EF}
.street{fill:var(--plan-street)}
.facade{stroke:var(--wall);stroke-width:7;stroke-linecap:round}
.tx{font:600 24px var(--f-d);fill:var(--ink);letter-spacing:.06em}
.tx.s{font-size:17px;font-weight:500;fill:var(--muted);letter-spacing:.1em}
.tx.w{fill:#fff}
.obj{fill:#E7ECE9;stroke:var(--wall);stroke-width:3}
.lift{fill:#fff;stroke:var(--wall);stroke-width:2.5}
.lift.on{fill:var(--g-lt);stroke:var(--g-dk);stroke-width:4}
.liftn{font:700 44px var(--f-d);fill:var(--ink)}
.liftn.on{fill:#fff}
.room{fill:var(--g-tint);stroke:var(--g);stroke-width:3}
.kiosk{fill:#fff;stroke:var(--wall);stroke-width:3}
.kscr{fill:var(--g)}
.kiosk.me{stroke:var(--g-dk);stroke-width:5}
.tab{fill:#fff;stroke:var(--wall);stroke-width:2.5}
.zoom{position:absolute;top:14px;right:14px;min-height:56px;padding:0 22px;border:2px solid var(--line);border-radius:12px;background:#fff;font:600 20px var(--f-d);letter-spacing:.02em;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoom:active{background:var(--g-tint)}
.footprint{fill:url(#hat);stroke:#9AA79F;stroke-width:4}
.big{font:700 46px var(--f-d);fill:var(--g-dk);letter-spacing:.02em}
.bigs{font:500 26px var(--f-b);fill:var(--ink)}
.park{font:700 64px var(--f-d);fill:var(--ink);letter-spacing:.14em}
/* tablety przy windach: pionowe, ciemne jak oryginały, w barwach aplikacji */
body.is-tab{padding:0;background:var(--bg)}
body.is-tab,body.is-tab #tablet{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.is-tab .app{display:none}
#tablet{display:none;position:fixed;top:0;right:0;bottom:0;left:0;flex-direction:column;overflow:hidden;color:var(--ink);
  background:#fff;--u:calc(min(100vw,75vh)/768);
  padding:calc(var(--u)*30 + 20px) calc(var(--u)*36) calc(var(--u)*24)}
#tablet:before{content:"";position:absolute;top:0;left:0;right:0;height:calc(var(--u)*14 + 20px);background:var(--g)}
.is-tab #tablet{display:flex}
.tt{display:flex;align-items:center;justify-content:center;font:700 calc(var(--u)*104)/1.05 var(--f-d);letter-spacing:.01em}
.tt>*+*{margin-left:calc(var(--u)*20)}
.tt span{color:var(--g)}
.ar{display:block;width:calc(var(--u)*34);height:calc(var(--u)*50);background:var(--g);-webkit-clip-path:polygon(100% 0,100% 100%,0 50%);clip-path:polygon(100% 0,100% 100%,0 50%)}
.ar.r{-webkit-clip-path:polygon(0 0,0 100%,100% 50%);clip-path:polygon(0 0,0 100%,100% 50%)}
.tr{height:2px;background:var(--line);margin:calc(var(--u)*14) 0}
.ts{margin:0;text-align:center;font:600 calc(var(--u)*27)/1.2 var(--f-d);letter-spacing:.2em;text-transform:uppercase}
.tp{margin:calc(var(--u)*16) 0 calc(var(--u)*6);text-align:center;font:700 calc(var(--u)*27)/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.tf{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--u)*60) minmax(0,1fr);grid-auto-rows:minmax(0,1fr)}
.tf.sparse{padding:calc(var(--u)*10) 0}
.tc{display:flex;align-items:center;min-width:0}
.tc>*+*{margin-left:calc(var(--u)*12)}
.tc.l{justify-content:flex-end;text-align:right}
.tc.r{justify-content:flex-start;text-align:left}
.tc .rh{flex:none;width:calc(var(--u)*50);height:calc(var(--u)*58);font-size:calc(var(--u)*26);-webkit-clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.tn{font:600 calc(var(--u)*25)/1.08 var(--f-d);letter-spacing:.02em;text-transform:uppercase;min-width:0}
.tn small{display:block;font:500 calc(var(--u)*20)/1.15 var(--f-b);letter-spacing:.01em;text-transform:none;color:var(--muted)}
.tn>div+div{margin-top:.4em}
.sparse .tn{font-size:calc(var(--u)*29)}
.sparse .tn small{font-size:calc(var(--u)*22)}
.sparse .tc .rh{width:calc(var(--u)*66);height:calc(var(--u)*78);font-size:calc(var(--u)*34)}
.tx2{position:relative}
.tx2:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:calc(var(--u)*7);margin-left:calc(var(--u)*-3.5);background:repeating-linear-gradient(180deg,var(--g) 0 calc(var(--u)*7),#CFE3D3 calc(var(--u)*7) calc(var(--u)*14))}
.tx2 i{position:absolute;left:50%;top:50%;width:calc(var(--u)*26);height:calc(var(--u)*34);margin:calc(var(--u)*-17) 0 0 calc(var(--u)*-13);background:var(--g-dk);-webkit-clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.tnote{margin-top:calc(var(--u)*10);padding:calc(var(--u)*12) calc(var(--u)*16);border-radius:calc(var(--u)*12);background:var(--g-tint);color:var(--g-dk);text-align:center;font:600 calc(var(--u)*23)/1.2 var(--f-d);letter-spacing:.04em}
.vhot{position:fixed;right:0;bottom:0;width:140px;height:140px;z-index:20;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.brand{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vmenu{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;display:none;place-items:center;background:rgba(32,40,35,.45)}
.vmenu.open{display:grid}
.vcard{width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;padding:22px;border-radius:18px;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.pdots{display:flex;justify-content:center;margin:6px 0 8px}
.pdots i+i{margin-left:16px}
.pdots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--g);background:transparent}
.pdots i.on{background:var(--g)}
.pmsg{min-height:24px;text-align:center;font:600 18px var(--f-d);color:#B3261E}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.pad button{min-height:68px;border:2px solid var(--line);border-radius:12px;background:var(--panel-2);font:600 30px var(--f-d)}
.pad button:active{background:var(--g-tint)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.vcard h3{margin:0 0 4px;font:700 30px/1.05 var(--f-d)}
.vcard p{margin:0 0 14px;color:var(--muted);font-size:16px}
.vopt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;width:100%;min-height:64px;margin-top:8px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:left}
.vopt.on{border-color:var(--g);background:var(--g-tint)}
.vopt .rh{width:44px;height:50px;font-size:20px}
.vopt span span{display:block}
.vopt .vn{font:600 22px/1.1 var(--f-d)}
.vopt .vs{font-size:15px;color:var(--muted)}
.vclose{margin-top:14px;width:100%;min-height:56px;border:2px solid var(--line);border-radius:12px;background:#fff;font:600 20px var(--f-d)}
.hit{cursor:pointer}
.hit:hover .room,.hit:hover .obj,.hit:hover .recfill{stroke-width:5}
.hit:focus-visible{outline:none}
.hit:focus-visible .room,.hit:focus-visible .obj,.hit:focus-visible .recfill{stroke:var(--g-dk);stroke-width:6}
.sel .room{fill:var(--g-lt);stroke:var(--g-dk);stroke-width:5}
.sel .recfill{fill:var(--g-tint);stroke:var(--g-dk);stroke-width:5}
.sel .recfill-i{stroke:var(--g-tint)}
.sel .recfill-o{stroke:var(--g-dk)}
.sel .obj{fill:var(--g-tint);stroke:var(--g-dk);stroke-width:5}
.dim{opacity:.7}
.recfill{fill:#fff;stroke:var(--wall);stroke-width:4}
.door{stroke:var(--g);stroke-width:8;stroke-linecap:round}
.casing{fill:none;stroke:#fff;stroke-width:20;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.under{fill:none;stroke:var(--g);stroke-opacity:.28;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.route{fill:none;stroke:var(--g);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 18;animation:flow .9s linear infinite;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-19}}
.pin path{fill:var(--g-dk);stroke:#fff;stroke-width:3}
.pin circle{fill:#fff}
.you-dot{fill:var(--ink);stroke:#fff;stroke-width:4}
.pulse{fill:var(--g-lt);transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.6);opacity:0}}
.pill{fill:var(--ink)}
.pill-t{font:700 19px var(--f-d);letter-spacing:.12em;fill:#fff}
.call{fill:var(--g-dk);stroke:#fff;stroke-width:3}
.call-t{font:700 30px var(--f-d);letter-spacing:.03em;fill:#fff}
.call-n{font:700 30px var(--f-d);fill:var(--g-dk)}
.arrow{fill:var(--g-dk)}

@media (max-width:899px){
  html,body{height:auto}
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  .stage{order:-1;height:min(78vw,520px);min-height:300px}
  .list{max-height:520px}
  h1{font-size:34px}
}
@media (prefers-reduced-motion:reduce){
  .route{animation:none}
  .pulse{animation:none;opacity:.3}
}
</style>

<div class="app">
  <aside class="side" aria-label="Wybór celu i trasa">
    <header class="brand">
      <svg viewBox="0 0 64 96" aria-hidden="true"><path d="M32 0 46 24 32 48 18 24Z" fill="#50B058"/><path d="M12 22 26 46 12 70-2 46Z" transform="translate(2 0)" fill="#087838"/><path d="M52 22 66 46 52 70 38 46Z" transform="translate(-2 0)" fill="#087838"/><path d="M32 46 46 70 32 94 18 70Z" fill="#084820"/></svg>
      <div><b>NOBEL<br>TOWER</b><small id="kid">Parter · ul. Dąbrowskiego 77A</small></div>
    </header>
    <section id="home">
      <div class="lead"><h1>Dokąd idziesz?</h1><p>Dotknij nazwy, a plan pokaże drogę od tego kiosku.</p></div>
      <ul class="list" id="list"></ul>
    </section>
    <section id="route" hidden></section>
  </aside>
  <main class="stage"><svg id="map" viewBox="-120 -20 1700 1260" role="img" aria-label="Plan parteru Nobel Tower"></svg><button type="button" id="zoom" class="zoom">Cały parter</button></main>
</div>

<section id="tablet" aria-live="polite"></section>
<div class="vhot" id="vhot" aria-hidden="true"></div>
<div class="vmenu" id="vmenu" role="dialog" aria-modal="true" aria-label="Wybór wariantu ekranu"><div class="vcard"><div id="vpin"><h3>Kod dostępu</h3><p>Wpisz czterocyfrowy kod, aby zmienić wariant ekranu.</p><div class="pdots" id="pdots"></div><div class="pmsg" id="pmsg" aria-live="polite"></div><div class="pad" id="pad"></div></div><div id="vsel" style="display:none"><h3>Wariant ekranu</h3><p>Wybierz, na którym urządzeniu działa ta strona.</p><div id="vlist"></div></div><button type="button" class="vclose" id="vclose">Zamknij</button></div></div>

<script>
(() => {
'use strict';

/* ================= DANE ================= */
/* Piętra, windy i opisy z tablicy "Mapa placówek medycznych" w holu.
   Wejścia do Apteki, Solumedu i Scanmedu: od strony parkingu, trzeba wyjść z budynku. */
const D = [
  { id:'apteka',    name:'Apteka Vivre',              sub:'Apteka · wejście z zewnątrz, na rogu budynku',            floor:0, type:'out',   door:'vivre',   icon:'cross' },
  { id:'solumed-p', name:'Solumed',                   sub:'Wizyty prywatne · wejście z zewnątrz',    floor:0, type:'out',   door:'solumed', icon:'pill' },
  { id:'scanmed',   name:'Scanmed – POZ',             sub:'NFZ oraz wizyty prywatne · wejście z zewnątrz', floor:0, type:'out', door:'scanmed', icon:'steth' },
  { id:'yuzu',      name:'Restauracja Yuzu',          sub:'Restauracja · winda 1–2',                         floor:1, type:'lift',  lift:'1-2',     icon:'fork' },
  { id:'diagnoza',  name:'Moja Diagnoza',             sub:'Rezonans, tomografia, USG oraz RTG · winda 3',    floor:2, type:'lift',  lift:'3',       icon:'ring' },
  { id:'diagnostyka',name:'Diagnostyka',              sub:'Punkt pobrań · winda 3',                          floor:2, type:'lift',  lift:'3',       icon:'tube' },
  { id:'bamberski', name:'Bamberski Dwór',            sub:'NFZ oraz wizyty prywatne · winda 3',              floor:3, type:'lift',  lift:'3',       icon:'house' },
  { id:'solumed-cm',name:'Centrum Medyczne Solumed',  sub:'Badania kliniczne · winda 3',                     floor:3, type:'lift',  lift:'3',       icon:'cross' },
  { id:'bocian',    name:'Klinika Bocian',            sub:'Leczenie niepłodności IN VITRO · winda 1–2',      floor:8, type:'lift',  lift:'1-2',     icon:'cross' },
  { id:'genesis',   name:'Genesis',                   sub:'Poradnia genetyczna · winda 1–2',                 floor:9, type:'lift',  lift:'1-2',     icon:'dna' },
  { id:'iozss',     name:'I.O.Z.S.S.',                sub:'Najwyższe piętro · winda 1–2',                           floor:13, type:'lift', lift:'1-2',     icon:'house' },
  { id:'recepcja',  name:'Recepcja',                 sub:'Informacja i pomoc',                              floor:0, type:'lobby', icon:'desk', group:'W budynku' },
  { id:'schody',    name:'Schody',                    sub:'Klatka schodowa',                                 floor:0, type:'lobby', icon:'stairs', group:'W budynku' },
  { id:'wyjscie',   name:'Wyjście główne',            sub:'Wiatrołap i wyjście na parking',                  floor:0, type:'lobby', icon:'exit', group:'W budynku' }
];
const BY = new Map(D.map(d => [d.id, d]));

const ICONS = {
  cross:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
  pill:'<rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-40 12 12)"/><path d="M9 15l6-6"/>',
  steth:'<path d="M6 3v6a4 4 0 0 0 8 0V3M10 13v2a4 4 0 0 0 8 0v-2"/><circle cx="18" cy="11" r="2"/>',
  fork:'<path d="M6 3v7M4 3v5a2 2 0 0 0 4 0V3M6 10v11M17 3c-2 2-3 5-3 8h3v10"/>',
  ring:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  tube:'<path d="M9 3h6M10 3v14a2 2 0 0 0 4 0V3M10 10h4"/>',
  house:'<path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/>',
  dna:'<path d="M7 3c0 7 10 7 10 18M17 3c0 7-10 7-10 18M9 8h6M9 16h6"/>',
  desk:'<path d="M3 17h18M5 17v-6h14v6M9 11V8h6v3"/>',
  stairs:'<path d="M3 20h5v-4h4v-4h4V8h5"/>',
  exit:'<path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/>'
};

/* ================= TRASA ================= */
/* Geometria z inwentaryzacji parteru (rzut 1:150). Zapis w pikselach rzutu (110 dpi), przeliczany na jednostki planu:
   1 piksel rzutu = 2,75 jednostki planu = 34,6 mm w rzeczywistości. */
const gx = px => Math.round((px - 558) * 2.75 + 52), gy = py => Math.round((py - 461) * 2.75 + 60);
const gp = pts => pts.map(q => gx(q[0]) + ',' + gy(q[1])).join(' ');
const FY = 1069;                                     // linia elewacji południowej (wejścia z ulicy)
/* Trzy kioski stoją w holu przed recepcją. Numer kiosku bierze się z adresu: #kiosk-1, #kiosk-2 lub #kiosk-3. */
const KIOSKS = { 1:{ x:443, y:470 }, 2:{ x:291, y:470 }, 3:{ x:140, y:470 } };
const kioskId = () => { const m = (location.hash || '').match(/kiosk-([123])/); return m ? +m[1] : 2; };
let K = KIOSKS[kioskId()];
const LX = { 3:265, 2:439, 1:617 };                  // windy od lewej: 3, 2, 1
const DX = { scanmed:gx(292), solumed:gx(1218), vivre:gx(1575) };   // wejścia placówek na elewacji
const DM = { scanmed:19, solumed:13, vivre:26 };      // odległość od wejścia głównego, w metrach (z rzutu)
const WX = gx(832);                                  // oś wejścia głównego
const S0 = () => [[K.x, K.y + 48], [K.x, 722]];
const EXIT = () => S0().concat([[WX,722],[WX,FY+48]]);

function routePts(d) {
  if (d.type === 'lift') { const n = d.lift === '3' ? 3 : 2; return S0().concat([[LX[n],722],[LX[n],792]]); }
  if (d.type === 'out')  return EXIT().concat([[DX[d.door],FY+48],[DX[d.door],FY-14]]);
  if (d.id === 'recepcja') return [[K.x, K.y + 48],[566, K.y + 48],[566, 338]];
  if (d.id === 'schody')   return S0().concat([[WX,722],[900,722],[900,706],[1020,706],[1020,900]]);
  return S0().concat([[WX,722],[WX,FY-20]]);   // wyjście
}
const pinAt = d => { const p = routePts(d); return d.type === 'lift' ? null : p[p.length - 1]; };

function stepsFor(d) {
  const s = ['Jesteś przy kiosku w holu, obok recepcji.'];
  if (d.type === 'lift') {
    if (d.lift === '3') s.push('Idź do wind. Winda 3 jest najdalej od wejścia głównego.');
    else s.push('Idź do wind. Winda 1 stoi najbliżej wejścia głównego, winda 2 obok niej.');
    s.push(`Wjedź windą ${d.lift === '3' ? '3' : '1 lub 2'} na ${d.floor === 0 ? 'parter' : 'piętro ' + d.floor}.`);
    return s;
  }
  if (d.type === 'out') {
    s.push('Idź do wejścia głównego, za rzędem krzeseł.');
    s.push('Przejdź przez dwie pary drzwi i wyjdź z budynku.');
    if (d.door === 'scanmed') s.push(`Po wyjściu skręć w prawo i idź wzdłuż budynku, około ${DM.scanmed} m. Scanmed zajmuje lewą część budynku.`);
    else if (d.door === 'solumed') s.push(`Po wyjściu skręć w lewo i idź wzdłuż budynku, około ${DM.solumed} m, mijając wyjście ewakuacyjne. Solumed jest przed Apteką.`);
    else s.push(`Po wyjściu skręć w lewo i idź wzdłuż budynku, około ${DM.vivre} m, aż do rogu. Apteka Vivre jest za Solumedem.`);
    return s;
  }
  if (d.id === 'recepcja') { s.push('Idź prosto w głąb holu. Recepcja stoi pośrodku, przed ścianą z zielenią.'); return s; }
  if (d.id === 'schody')   { s.push('Idź do wejścia głównego, za rzędem krzeseł. Drzwi do schodów są tuż obok wiatrołapu.'); return s; }
  s.push('Idź do wejścia głównego, za rzędem krzeseł.'); s.push('Przejdź przez dwie pary drzwi i wyjdź z budynku.');
  return s;
}

const holdOff = () => clearTimeout(holdT);
[$('vhot'), document.querySelector('.brand')].forEach(el => {
  ['pointerdown', 'touchstart', 'mousedown'].forEach(ev => el.addEventListener(ev, holdOn));
  ['pointerup', 'pointerleave', 'pointercancel', 'touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => el.addEventListener(ev, holdOff));
  el.addEventListener('contextmenu', e => e.preventDefault());
});
$('vclose').addEventListener('click', () => $('vmenu').classList.remove('open'));
$('vmenu').addEventListener('click', e => {
  if (e.target === $('vmenu')) $('vmenu').classList.remove('open');
  const b = e.target.closest('[data-v]');
  if (b) { location.hash = b.dataset.v; $('vmenu').classList.remove('open'); }
});

/* na tabletach przy windach ekran jest tylko do czytania: bez przewijania, powiększania i zaznaczania (poza ukrytym rogiem z kodem) */
document.addEventListener('touchmove', e => { if (document.body.classList.contains('is-tab') && !$('vmenu').classList.contains('open')) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => { if (document.body.classList.contains('is-tab')) e.preventDefault(); }));

/* ================= KAMERA ================= */
const VIEWS = { hall:[-120,-20,1700,1260], west:[-900,-40,1900,1380], mid:[600,-40,1800,1307], east:[700,-40,2400,1743], all:[-1130,-40,4260,1400] };
let cur = VIEWS.hall.slice(), raf = 0, overview = false;
const wantView = () => {
  if (overview) return VIEWS.all;
  const d = state.id ? BY.get(state.id) : null;
  if (d && d.type === 'out') return d.door === 'scanmed' ? VIEWS.west : d.door === 'solumed' ? VIEWS.mid : VIEWS.east;
  return VIEWS.hall;
};
function goView(instant) {
  const to = wantView(), from = cur.slice(), t0 = performance.now(), T = 700;
  cancelAnimationFrame(raf);
  $('zoom').textContent = overview ? 'Przybliż' : 'Cały parter';
  if (instant || matchMedia('(prefers-reduced-motion:reduce)').matches) { cur = to.slice(); svg.setAttribute('viewBox', cur.join(' ')); return; }
  const step = now => {
    const k = Math.min(1, (now - t0) / T), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    cur = from.map((v, i) => v + (to[i] - v) * e); svg.setAttribute('viewBox', cur.join(' '));
    if (k < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
$('zoom').addEventListener('click', () => { overview = !overview; goView(); });

/* ================= AKCJE ================= */
function select(id) { state.id = id; overview = false; renderSide(); renderMap(); goView(); }
function clear() { state.id = null; overview = false; renderSide(); renderMap(); goView(); listEl.scrollTop = 0; }

listEl.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) select(b.dataset.id); });
routeEl.addEventListener('click', e => { if (e.target.closest('#back')) clear(); });
svg.addEventListener('click', e => { const g = e.target.closest('[data-id]'); if (g) select(g.dataset.id); });
svg.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const g = e.target.closest('[data-id]'); if (g) { e.preventDefault(); select(g.dataset.id); }
});

/* powrót do ekranu startowego po 90 s bezczynności */
let idle = 0;
const bump = () => { clearTimeout(idle); idle = setTimeout(() => { if (state.id) clear(); }, 90000); };
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, bump, true));
bump();

const setKiosk = () => { drawVars(); const tb = tabletId(); document.body.classList.toggle('is-tab', !!tb); if (tb) { renderTablet(tb); return; } K = KIOSKS[kioskId()]; $('kid').textContent = `Parter · kiosk ${kioskId()}`; renderSide(); renderMap(); goView(true); };
window.addEventListener('hashchange', setKiosk);
/* wariant wybrany przez PIN zostaje na urządzeniu, także po ponownym uruchomieniu aplikacji z ekranu głównego */
let firstRun = false;
try {
  if (!/(kiosk|tablet)-\d/.test(location.hash)) { const v = localStorage.getItem('nt-variant'); if (v) location.hash = v; else firstRun = true; }
} catch (e) { firstRun = !/(kiosk|tablet)-\d/.test(location.hash); }
window.addEventListener('hashchange', () => { try { if (/(kiosk|tablet)-\d/.test(location.hash)) localStorage.setItem('nt-variant', location.hash.slice(1)); } catch (e) {} });
try { if (/(kiosk|tablet)-\d/.test(location.hash)) localStorage.setItem('nt-variant', location.hash.slice(1)); } catch (e) {}
setKiosk(); renderList();
/* pierwsze uruchomienie na urządzeniu: od razu wybór wariantu, bez kodu */
if (firstRun) { drawVars(); $('vpin').style.display = 'none'; $('vsel').style.display = ''; $('vmenu').classList.add('open'); }
})();
</script>
